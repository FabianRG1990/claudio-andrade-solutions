<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Claudio Andrade Solutions — Soluciones tecnológicas a medida</title>
    <base href="/" />
    <!-- viewport-fit=cover habilita `env(safe-area-inset-*)` en iOS para que
         el nav fijo y los CTAs respeten notch / dynamic island / home indicator
         (iPhone X+). Sin este flag, los insets devuelven 0 y el contenido se
         puede meter bajo el notch en landscape. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Claudio Andrade Solutions es una consultora tecnológica enfocada en soluciones a medida: auditorías, sistemas, integraciones de IA, apps verticales y automatización para empresas que ya tienen tracción."
    />
    <meta name="theme-color" content="#06091A" />
    <!-- Favicon — el lobo de la marca, multi-tamaño.
         - favicon.ico (16/32/48 multi-frame): default que el browser pide
           sin que se lo digamos. Crítico que sea válido o el tab queda con
           el ícono genérico.
         - PNG sized 32 + 192: browsers modernos los prefieren si los ofrecemos.
         - apple-touch-icon 192: iOS al guardar a home screen.
         emblem-mark y emblem-stamp (nav, footer, page-headers) usan
         `/logo/logo-192.{avif,webp,png}` via <picture> con fallback. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/logo-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo/logo-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo/logo-192.png" />

    <!-- Roboto self-hosted desde /fonts/. Las @font-face viven en el SCSS
         global (libs/.../styles/mixins/_typography.scss) y se inlinean como
         critical CSS por Beasties. Acá solo preloadeamos los 2 pesos más
         usados (400 + 500 normal) para que el browser arranque la descarga
         apenas parsea el <head>, sin esperar al CSS bundle.
         Excepciones que NO usan Roboto:
           1. Wordmark del navbar (.floating-nav__brand-wordmark) → Times
           2. Números grandes / stats (.font-mono) → Times -->
    <link
      rel="preload"
      href="/fonts/roboto-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/roboto-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Preload del lobo del splash para que esté listo en el primer paint.
         192 webp = 8-12 KB, decode sub-frame, no compite con el bundle. -->
    <link
      rel="preload"
      href="/logo/logo-192.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- GLB del pez (~7.7 MB) — prefetch siempre. Lo usan AMBOS renderers
         (wolf-fish-three del hero + companion-fish del swim), y el user
         pidió mantener la animación de companion-fish también en phone.
         `prefetch` (no preload) = low priority — llega DESPUÉS del bundle
         + imágenes + fuentes del hero, sin pelear el critical render path.
         Antes el GLB era `<link rel="preload" as="fetch" fetchpriority="high">`
         que ARRANCABA la descarga apenas el browser parseaba el HTML,
         sumando 5-15s al tiempo de página utilizable en mobile (3G/4G).
         crossorigin="anonymous" matchea el fetch del loader. -->
    <link
      rel="prefetch"
      href="/hero-wolf/fish-model.glb"
      as="fetch"
      type="model/gltf-binary"
      crossorigin="anonymous"
    />

    <!-- =========================================================================
         Viewport height fix — `--app-vh` LOCKED por orientación.
         Bug reportado (Chrome Android, "imagen brinca y brinca y brinca al
         primer scroll"): la URL bar de Chrome Android se colapsa
         progresivamente durante los primeros 200-300ms de scroll, disparando
         múltiples `visualViewport.resize` events. La versión previa de este
         script crecía `--app-vh` con cada resize (sticky-max), lo que
         engordaba `.hero` un poco con cada tick → la imagen `object-fit:
         cover` re-cropeaba con cada paso → JUMP visible.
         Estrategia nueva:
           • LOCKED por orientación: medimos UNA vez al boot + reseteamos al
             cambio real de orientación. Resize/visualViewport changes durante
             scroll son IGNORADOS (no crecemos en ese path).
           • Initial measurement con piso = `screen.height` (la altura del
             dispositivo en CSS px, NO afectada por URL bar). En Chrome Android
             portrait esto da la altura URL-bar-oculta upfront → `.hero` arranca
             ya con su tamaño final → no hay nada que re-cropear al colapsar.
           • iOS Safari: `innerHeight` ya es la layout viewport (URL bar
             oculta) — Math.max con screen.height da el mismo valor o no
             pierde nada.
           • Orientation change: reseteo + re-medición en 0/50/200/500ms +
             RAF para capturar el valor estabilizado tras la rotación
             (iOS Safari tiene delay entre orientationchange e innerHeight).
         Inline + síncrono en <head> antes del <style> del splash: la
         variable está seteada ANTES del primer paint.
         ========================================================================= -->
    <script>
      (function () {
        var currentVh = 0;
        var lastOrientation = null;

        function measureVh() {
          // En Chrome Android, `innerHeight` reporta la viewport VISIBLE
          // (cambia con URL bar). En iOS Safari, reporta la LAYOUT viewport
          // (URL bar oculta, valor estable). screen.height es el alto del
          // dispositivo en CSS px — NO cambia con URL bar en ninguno de los
          // dos browsers. Tomamos el MÁXIMO para garantizar que arrancamos
          // con el valor URL-bar-oculta en TODOS los browsers.
          // (En PWA installed mode o desktop, screen.height es el monitor
          // entero — innerHeight es lo correcto y termina ganando.)
          var inner = window.innerHeight || 0;
          var visual =
            (window.visualViewport && window.visualViewport.height) || 0;
          var screenH = (window.screen && window.screen.height) || 0;
          // Clamp screen.height al ratio razonable del aspect del viewport
          // para evitar valores absurdos (multi-monitor, screen.height del
          // monitor entero cuando la ventana es chica). Si screen es más de
          // 1.6x el visible, ignoramos — no es nuestra ventana.
          if (visual > 0 && screenH > visual * 1.6) screenH = 0;
          if (inner > 0 && screenH > inner * 1.6) screenH = 0;
          return Math.max(inner, visual, screenH);
        }

        function setAppVh(force) {
          var h = measureVh();
          // LOCKED: solo escribimos en boot (currentVh=0) o cuando force=true
          // (orientation change). Cambios de visualViewport durante scroll
          // (URL bar collapse) NO entran acá.
          if (currentVh === 0 || force === true) {
            currentVh = h;
            document.documentElement.style.setProperty(
              '--app-vh',
              currentVh + 'px',
            );
          }
        }

        function getOrientation() {
          if (
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(orientation: landscape)').matches
          ) {
            return 'landscape';
          }
          return 'portrait';
        }

        function handleOrientationChange() {
          var current = getOrientation();
          if (current === lastOrientation) return;
          lastOrientation = current;
          // Reset + re-medición forzada. iOS Safari tiene delay entre
          // orientationchange y innerHeight update — re-medimos en varias
          // ventanas para capturar el valor estabilizado.
          currentVh = 0;
          setAppVh(true);
          setTimeout(function () { currentVh = 0; setAppVh(true); }, 50);
          setTimeout(function () { currentVh = 0; setAppVh(true); }, 200);
          setTimeout(function () { currentVh = 0; setAppVh(true); }, 500);
          if (typeof requestAnimationFrame === 'function') {
            requestAnimationFrame(function () { currentVh = 0; setAppVh(true); });
          }
          // Animación suave de orientation change. Sin esta clase, el browser
          // hace un hard cut: el contenedor pasa de portrait a landscape
          // instantáneamente, la imagen `object-fit: cover` re-cropea con
          // origen distinto, y la nueva <source> del <picture> (si cambia
          // el media-query) puede tardar 50-150ms en cargar — el user ve un
          // "corte" feo.
          // Estrategia: html.is-orienting → CSS aplica fade+blur a .hero__scene
          // durante 380ms. Tiempo distribuido: 180ms fade-out, 60ms hold a
          // opacity baja (cubre el reflow + carga de nueva <source> + ajuste
          // del --app-vh), 180ms fade-in. El user percibe una transición tipo
          // "lente que se reenfoca" en vez del corte abrupto.
          var doc = document.documentElement;
          doc.classList.add('is-orienting');
          setTimeout(function () { doc.classList.remove('is-orienting'); }, 380);
        }

        lastOrientation = getOrientation();
        setAppVh();
        // Re-measure tras el primer paint — algunas versiones de iOS
        // reportan innerHeight incorrectamente en el primer tick síncrono.
        // Esto es el ÚNICO update no-orientation que permitimos: se ejecuta
        // ANTES de que el user pueda scrollear (rAF 1 = ~16ms post-script).
        if (typeof requestAnimationFrame === 'function') {
          requestAnimationFrame(function () {
            var h = measureVh();
            // Solo upgrade si es mayor que el actual — evita downgrade que
            // re-cropearía el hero.
            if (h > currentVh) {
              currentVh = h;
              document.documentElement.style.setProperty('--app-vh', h + 'px');
            }
          });
        }

        // Ya NO escuchamos `resize` ni `visualViewport.resize` directos —
        // esos eran los culpables del "brinca y brinca" en Chrome Android
        // durante el colapso animado de la URL bar.
        // orientationchange + matchMedia change cubren el ÚNICO caso donde
        // queremos actualizar: rotación real del dispositivo.
        window.addEventListener('orientationchange', handleOrientationChange);
        if (typeof window.matchMedia === 'function') {
          var mql = window.matchMedia('(orientation: landscape)');
          if (typeof mql.addEventListener === 'function') {
            mql.addEventListener('change', handleOrientationChange);
          } else if (typeof mql.addListener === 'function') {
            // Safari iOS < 14
            mql.addListener(handleOrientationChange);
          }
        }
      })();
    </script>

    <!-- =========================================================================
         Boot splash — capa pintada en el primer frame, antes de que Angular
         hidrate. Cubre el viewport con #06091A (mismo navy que el ocean-bg
         base, sin costura cuando crossfadea) + logo breathing en el centro.
         Mientras `html.app-booted` no esté presente, todo lo que pinta Angular
         (`app-root`) queda con opacity 0 y filter blur — el usuario no ve
         elementos "saltando a su sitio". `app.ts` setea la clase con un
         min-hold de 350ms para que el splash respire antes de fadear.
         Referencia: pattern usado por Stripe / Linear / Vercel en hard refresh.
         ========================================================================= -->
    <style>
      /* app-root no se esconde a nivel de host — los hijos (.ocean-bg__canvas,
         .app-main, .floating-nav-rail, app-footer) tienen sus propios opacity:0
         hasta que llega `html.app-booted`. Ocultar `app-root` con visibility:
         hidden añadía riesgo de "página en blanco" si por cualquier razón
         (hidratación lenta, JS bloqueado, fallo en afterNextRender) el flag
         tardaba en aparecer. El splash de fondo cubre todo igual. */

      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #06091a;
        pointer-events: none;
        /* Crossfade hacia afuera: blur + scale up + opacity. El blur ascendente
           es la transición que usan los preloaders premium (Apple onboarding,
           Linear): da la sensación de "saliendo del foco" no de "apagándose".
           650ms total — corto pero suficiente para que se lea como gesto y
           no como switch binario. ease-out (no in-out) → la masa visual sale
           rápido al principio, suaviza al final = sensación de elegancia. */
        transition:
          opacity 650ms cubic-bezier(0.32, 0.72, 0, 1),
          filter 650ms cubic-bezier(0.32, 0.72, 0, 1),
          transform 650ms cubic-bezier(0.32, 0.72, 0, 1),
          visibility 0s linear 650ms;
      }

      .boot-splash__logo {
        position: relative;
        z-index: 1;
        width: 72px;
        height: 72px;
        /* Latido sutil — escala +/- 4% sobre 2.4s. Frecuencia tipo respiración
           humana (~25 bpm); evita la sensación robótica de un spinner. */
        animation: boot-splash-breath 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        /* Halo difuso debajo (sin glow loud — solo presencia). El drop-shadow
           sobre PNG con alpha hace que el lobo flote sobre el navy sin parecer
           pegado. */
        filter: drop-shadow(0 8px 32px rgb(94 196 209 / 0.18))
          drop-shadow(0 2px 8px rgb(6 9 26 / 0.6));
      }

      /* Anillo decorativo alrededor del logo del splash — gradient purple→cyan
         con box-shadow de glow. Estático (sin rotación) por pedido explícito.
         Técnica del original (Uiverse): un disco con gradient + un disco encima
         del color del fondo con blur fuerte; las orillas blureadas dejan filtrar
         el gradient como un anillo. Tamaño 120px contra logo de 72px → ring
         claramente visible con espacio cómodo entre la marca y el halo. */
      .boot-splash__halo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 120px;
        height: 120px;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .boot-splash__halo-ring {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
          rgb(186, 66, 255) 35%,
          rgb(0, 225, 255)
        );
        border-radius: 50%;
        filter: blur(1px);
        box-shadow:
          0px -5px 20px 0px rgb(186, 66, 255),
          0px 5px 20px 0px rgb(0, 225, 255);
        /* Linear porque cualquier easing se nota como tirón en una rotación
           continua. 1.1s = cadence más enérgica que el 1.7s del Uiverse
           original, lee como "cargando activo" sin entrar en frenetismo. */
        animation: boot-splash-spin 1.1s linear infinite;
      }

      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .boot-splash__halo-mask {
        position: absolute;
        inset: 0;
        /* Matchea #06091a del splash (no rgb(36,36,36) del original) para que
           el centro funda al fondo y el ring quede limpio sobre el navy. */
        background-color: #06091a;
        border-radius: 50%;
        filter: blur(10px);
      }

      @keyframes boot-splash-breath {
        0%,
        100% {
          opacity: 0.78;
          transform: scale(0.98);
        }
        50% {
          opacity: 1;
          transform: scale(1.02);
        }
      }

      html.app-booted .boot-splash {
        opacity: 0;
        filter: blur(8px);
        transform: scale(1.04);
        visibility: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash {
          transition:
            opacity 200ms linear,
            visibility 0s linear 200ms;
        }
        .boot-splash__logo,
        .boot-splash__halo-ring {
          animation: none;
        }
        html.app-booted .boot-splash {
          filter: none;
          transform: none;
        }
      }

      /* =====================================================================
         Reglas de entrada en cascada — vivieron originalmente en los SCSS de
         cada componente, pero Angular view-encapsulation envuelve `:root` con
         el atributo `_ngcontent-ng-cXXX` que `<html>` jamás tiene, así que el
         selector nunca matcheaba y el contenido quedaba en opacity: 0 para
         siempre tras fadear el splash. Estas reglas viven aquí (sin scoping)
         para garantizar que matchean. Los `opacity: 0` base sí están en los
         SCSS de componente porque .app-main / .floating-nav-rail / etc SÍ
         tienen el atributo y los matchean sin problema.
         ===================================================================== */
      html.app-booted .ocean-bg__canvas {
        opacity: 1;
      }
      html.app-booted .app-main {
        opacity: 1;
        transform: translateY(0);
      }
      html.app-booted app-footer {
        opacity: 1;
      }
      html.app-booted .floating-nav-rail {
        opacity: 1;
        transform: translateY(0);
      }

      /* =====================================================================
         Orientation change — fade+blur de la escena del hero mientras el
         browser hace el relayout. La clase `is-orienting` la pone el script
         de --app-vh por 380ms cuando detecta un cambio real de orientación.
         Sin esto, el user veía un "corte" abrupto entre portrait y landscape:
         la imagen object-fit:cover re-cropeaba sobre un origen distinto y
         la nueva <source> del <picture> tardaba ms en cargar.
         La transición es CSS pura (no requiere JS animation), aplicada a
         .hero__scene (no a .hero) para que solo la capa visual de fondo se
         atenúe — los headings se quedan en su lugar.
         Vive acá (global, sin view-encapsulation) por la misma razón que
         las reglas de `html.app-booted`: el selector matchea `<html>` y
         Angular envuelve los CSS del componente con un atributo ngContent
         que `<html>` jamás tiene.
         ===================================================================== */
      .hero__scene {
        transition: opacity 180ms cubic-bezier(0.32, 0.72, 0, 1),
                    filter 180ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      html.is-orienting .hero__scene {
        opacity: 0.35;
        filter: blur(10px);
      }
      @media (prefers-reduced-motion: reduce) {
        .hero__scene { transition: opacity 80ms linear; filter: none !important; }
        html.is-orienting .hero__scene { opacity: 0.6; filter: none; }
      }

      /* Hero — cascada interna back-to-front. La escena (bg image + lake-flow
         + sky + fish canvas) aparece heredando el fade-in de .app-main; estos
         elementos del foreground se asientan después en su propio ritmo.
         Orden: telemetry → badge → wave-card → title → copy → scroll-hint.
         Delays calibrados para que el ojo vea "primero la escena, después el
         layout humano". */
      html.app-booted .hero__telemetry,
      html.app-booted .hero__badge,
      html.app-booted .hero__title,
      html.app-booted .hero__copy,
      html.app-booted .hero__wave-card,
      html.app-booted .hero__scroll-hint {
        opacity: 1;
        transform: none;
      }
      html.app-booted .hero__title {
        filter: none;
      }
    </style>
  </head>
  <body class="grain">
    <!-- Splash queda en el DOM hasta que el usuario refresque; tras booteo
         vive con visibility:hidden + pointer-events:none, no captura clicks ni
         lecturas de screen reader (aria-hidden). El costo de mantener el
         elemento es despreciable (un <div> + <img>). -->
    <div class="boot-splash" aria-hidden="true">
      <div class="boot-splash__halo">
        <div class="boot-splash__halo-ring"></div>
        <div class="boot-splash__halo-mask"></div>
      </div>
      <img
        class="boot-splash__logo"
        src="/logo/logo-192.webp"
        alt=""
        width="72"
        height="72"
        decoding="sync"
        fetchpriority="high"
      />
    </div>

    <app-root></app-root>

    <!-- =========================================================================
         Boot trigger + failsafe.
         Primary: DOMContentLoaded — disparamos en cuanto el HTML está parseado
         y los CSS críticos in-line están aplicados. NO esperamos a `window.load`
         porque ese event espera TODOS los recursos (incluyendo el GLB de 7.7
         MB del pez que preloadeamos en paralelo) — esperar ese evento dejaba
         al usuario viendo el splash 10-30 segundos en mobile.
         La imagen estática del hero (avif/webp/png) se carga con
         `fetchpriority="high"` y `decoding="async"`; aunque el splash fade
         antes que termine de pintar, el browser ya tiene la imagen lista para
         el primer paint o llega ms después — la transición es invisible.
         Min-hold de 350ms: si DOMContentLoaded es muy rápido (cache caliente),
         el splash apenas se vería y se sentiría como flash. Forzar un mínimo
         lo lee como gesto, no como bug.
         Failsafe: 2000ms — garantiza que la app aparece SIEMPRE, incluso si
         DOMContentLoaded no se dispara (raro pero defensivo).
         ========================================================================= -->
    <script>
      (function () {
        var booted = false;
        function boot() {
          if (booted) return;
          booted = true;
          document.documentElement.classList.add('app-booted');
        }
        var MIN_HOLD = 350;
        var t0 = performance.now();
        function bootWithHold() {
          var elapsed = performance.now() - t0;
          var wait = Math.max(0, MIN_HOLD - elapsed);
          setTimeout(boot, wait);
        }
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
          bootWithHold();
        } else {
          document.addEventListener('DOMContentLoaded', bootWithHold, { once: true });
        }
        // Failsafe absoluto — el splash nunca debe quedarse colgado.
        setTimeout(boot, 2000);
      })();
    </script>
  </body>
</html>
