<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Claudio Andrade Solutions — Soluciones tecnológicas a medida</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Claudio Andrade Solutions es una consultora tecnológica enfocada en soluciones a medida: auditorías, sistemas, integraciones de IA, apps verticales y automatización para empresas que ya tienen tracción."
    />
    <meta name="theme-color" content="#06091A" />
    <!-- Favicon — el lobo de la marca, multi-tamaño.
         - favicon.ico (16/32/48 multi-frame): default que el browser pide
           sin que se lo digamos. Crítico que sea válido o el tab queda con
           el ícono genérico.
         - PNG sized 32 + 192: browsers modernos los prefieren si los ofrecemos.
         - apple-touch-icon 192: iOS al guardar a home screen.
         La versión 2.3MB original (`/logo/logo.png`) la dejamos para el nav
         y page-headers; el favicon usa las versiones reducidas (1-36 KB). -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/logo-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo/logo-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo/logo-192.png" />

    <!-- Sin preload de Fraunces italic — el original tampoco la carga.
         Los spans editoriales italic se renderizan con Times New Roman
         local + size-adjust 115.45% vía la @font-face Fraunces Fallback. -->

    <!-- Roboto Medium (500) — fuente principal del sitio. Se cargan los
         pesos 300/400/500 normal e italic para cubrir títulos (500),
         body (400), italics editoriales y los pocos lugares que usan 300.
         Excepciones que NO usan Roboto:
           1. Wordmark del navbar (.floating-nav__brand-wordmark) → Times
           2. Números grandes / stats (.font-mono) → Times -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;1,400;1,500&display=swap"
    />
  </head>
  <body class="grain">
    <app-root></app-root>
  </body>
</html>
