<div class="ocean-bg" aria-hidden="true">
  <!--
    Color base — abismo puro #061826, idéntico al cierre del hero. La
    uniformidad cromática es lo que elimina las costuras entre secciones.
  -->
  <div class="ocean-bg__base"></div>

  <!--
    Canvas con peces y plancton. Sin gradientes ni overlays decorativos
    sobre él: cualquier brillo localizado crearía bandas visibles entre
    secciones.
  -->
  <canvas #canvas class="ocean-bg__canvas"></canvas>
</div>
