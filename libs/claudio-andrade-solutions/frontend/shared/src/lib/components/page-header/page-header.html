<header class="page-header bg-mesh-deep">
  <app-caustic-bg />
  <app-bubble-stream [count]="12" class="page-header__bubbles" />

  <!-- Cierre inferior — funde el header al abismo puro para que la siguiente
       sección entre sin costura horizontal. -->
  <div class="page-header__fade" aria-hidden="true"></div>

  <div class="page-header__container">
    <div class="page-header__grid">
      <div class="page-header__left">
        <div appReveal>
          <app-eyebrow>{{ eyebrow() }}</app-eyebrow>
        </div>
        <p class="page-header__capitulo" appReveal [delay]="0.06">
          {{ capitulo() }}
        </p>
        <div class="page-header__stamp" appReveal [delay]="0.12">
          <app-emblem-stamp [size]="64" />
          <span class="page-header__stamp-text">Claudio Andrade Solutions · Est. 2019</span>
        </div>
      </div>

      <div class="page-header__right">
        <h1 class="page-header__title" appReveal>
          {{ title() }}
          @if (italic(); as it) {
            <span class="page-header__title-italic">{{ it }}</span>
          }
        </h1>
        @if (description(); as desc) {
          <p class="page-header__description" appReveal [delay]="0.14">
            {{ desc }}
          </p>
        }
      </div>
    </div>
  </div>
</header>

<!-- Emerge inferior — disuelve los peces dorados del OceanBackground (canvas
     fijo, detrás de .app-main) que asoman justo debajo del header. Sin esto, el
     header opaco (bg-mesh-deep #06091A) los tapa por completo y al pasar su
     borde inferior los peces APARECEN a brillo pleno de golpe → corte seco. Este
     velo arranca opaco en la costura y se desvanece ~12rem dentro del contenido,
     así los peces "emergen" en vez de cortarse. Vive fuera del `overflow:hidden`
     del header; su ::before va a z-index:-1 (detrás del contenido de .app-main,
     pero por encima del canvas de peces que está en una capa inferior). -->
<div class="page-header__emerge" aria-hidden="true"></div>
