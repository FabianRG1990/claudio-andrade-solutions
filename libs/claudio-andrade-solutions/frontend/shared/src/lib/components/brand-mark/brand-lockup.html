<div
  class="brand-lockup"
  [style.width.px]="width()"
  [style.height.px]="height()"
>
  <picture>
    <source srcset="/logo/logo-512.avif" type="image/avif" />
    <source srcset="/logo/logo-512.webp" type="image/webp" />
    <img
      src="/logo/logo-512.png"
      [alt]="alt()"
      class="brand-lockup__image"
      fetchpriority="high"
      decoding="async"
    />
  </picture>
</div>
