<!-- Brand — position: absolute. Logo + wordmark anclados al Hero (tope del
     documento en home). Solo se renderiza en la home — en otras rutas no
     hay Hero al que pertenecer, así que no aparece. -->
@if (isHome()) {
  <header class="floating-nav-brand">
    <a
      routerLink="/"
      class="floating-nav__brand"
      aria-label="Claudio Andrade Solutions · Inicio"
      (click)="onLinkClick('/', $event)"
    >
      <app-emblem-mark [size]="96" />
      <span class="floating-nav__brand-wordmark">Claudio Andrade Solutions</span>
    </a>
  </header>
}

<!-- Rail — position: absolute. Anclada al top del documento (no al
     viewport): al scrollear baja con la página y desaparece. Pill desktop +
     burger móvil viven aquí — todo el "navbar" (links + acceso a menú) se
     va con el scroll. Decisión consciente: sin nav post-scroll en mobile. -->
<div class="floating-nav-rail">
  <nav
    #navRef
    class="floating-nav__pill glass-nav-shell"
    aria-label="Navegación principal"
  >
    @if (pillVisible()) {
      <!-- Three.js + WebGL: solo se monta cuando el pill está realmente
           visible (≥880px). En mobile el pill es display:none y, sin este
           gate, el canvas seguía corriendo RAF + manteniendo contexto WebGL
           en GPU memory innecesariamente. -->
      <app-glass-pill-canvas />
    }

    @for (link of links; track link.href) {
      <a
        [routerLink]="link.href"
        class="floating-nav__link"
        [class.is-active]="isActive(link)"
        (click)="onLinkClick(link.href, $event)"
      >
        <span class="floating-nav__link-indicator" aria-hidden="true"></span>
        <span class="floating-nav__link-text">{{ link.label }}</span>
      </a>
    }
  </nav>

  <button
    type="button"
    class="floating-nav__burger glass-bubble"
    (click)="toggleMenu()"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    [attr.aria-expanded]="menuOpen()"
  >
    @if (menuOpen()) {
      <ng-icon name="phosphorX" size="16" />
    } @else {
      <ng-icon name="phosphorList" size="16" />
    }
  </button>
</div>

<!-- Bottom sheet móvil. Se queda renderizado y conmuta vía clase para que
     las animaciones CSS de entrada/salida fluyan en ambas direcciones. -->
<div
  class="mobile-menu"
  [class.is-open]="menuOpen()"
  [attr.aria-hidden]="!menuOpen()"
>
  <div class="mobile-menu__container">
    <ul class="mobile-menu__list">
      @for (link of links; track link.href; let i = $index) {
        <li class="mobile-menu__item" [style.--stagger-index]="i">
          <a [routerLink]="link.href" class="mobile-menu__link">
            <span>{{ link.label }}</span>
            <span class="mobile-menu__index">0{{ i + 1 }}</span>
          </a>
        </li>
      }
    </ul>
  </div>
</div>
