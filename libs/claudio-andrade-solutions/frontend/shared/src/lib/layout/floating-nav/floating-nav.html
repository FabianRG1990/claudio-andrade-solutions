<!-- Rail fixed que sigue al viewport. Dos estados:
       · top (scrollY ≤ 60px) → pill visible con todos los links
       · scrolled (scrollY > 60px) → pill colapsa, burger emerge top-right
     La transición vive en SCSS (opacity + transform + cubic-bezier spring).
     `is-scrolled` lo dispara el listener de scroll en floating-nav.ts. -->
<div
  class="floating-nav-rail"
  [class.is-scrolled]="scrolled()"
  [class.is-menu-open]="menuOpen()"
>
  <nav
    #navRef
    class="floating-nav__pill"
    aria-label="Navegación principal"
    [attr.aria-hidden]="scrolled() ? 'true' : null"
  >
    @for (link of links; track link.href) {
      <a
        [routerLink]="link.href"
        class="floating-nav__link"
        [class.is-active]="isActive(link)"
        (click)="onLinkClick(link.href, $event)"
      >
        <span class="floating-nav__link-indicator" aria-hidden="true"></span>
        <!-- Dual-label: el ancho del viewport <880 no acomoda
             "Acerca de nosotros" / "Contáctenos" en una línea horizontal
             dentro del pill compacto. CSS conmuta cuál span se renderiza
             según breakpoint (ver `.floating-nav__link-text--full/short`
             en floating-nav.scss). -->
        <span class="floating-nav__link-text floating-nav__link-text--full">{{ link.label }}</span>
        <span class="floating-nav__link-text floating-nav__link-text--short">{{ link.shortLabel }}</span>
      </a>
    }
  </nav>

  <!-- Burger morfeable: 3 líneas glass que rotan a X cuando el drawer
       está abierto. Animación CSS pura, sin swap de icono. Cuando el rail
       está en is-scrolled el burger aparece con fade + scale spring desde
       0.85; cuando vuelve al top, desaparece de la misma forma inversa. -->
  <button
    type="button"
    class="floating-nav__burger glass-bubble"
    (click)="toggleMenu()"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-hidden]="!scrolled() && !menuOpen() ? 'true' : null"
  >
    <span
      class="floating-nav__burger-icon"
      [class.is-open]="menuOpen()"
      aria-hidden="true"
    >
      <span class="floating-nav__burger-line"></span>
      <span class="floating-nav__burger-line"></span>
      <span class="floating-nav__burger-line"></span>
    </span>
  </button>
</div>

<!-- ────────────────────────────────────────────────────────────────────────
     Drawer mobile — réplica del side-menu de moofyvip: panel lateral 280px
     que entra de izquierda a derecha con transición 500ms ease-in-out,
     backdrop con blur que oscurece el contenido detrás. Cada item es un
     card glass con icono protagonista + label + esquina triangular
     decorativa; el item activo gana borde-izquierdo accent + gradiente
     lagoon de fondo.
     ──────────────────────────────────────────────────────────────────── -->
<div
  class="mobile-drawer"
  [class.is-open]="menuOpen()"
  [attr.aria-hidden]="!menuOpen()"
>
  <!-- Backdrop: capa oscura con blur — tap fuera del panel cierra. -->
  <div
    class="mobile-drawer__backdrop"
    (click)="closeMenu()"
    aria-hidden="true"
  ></div>

  <!-- Panel: sidenav que entra desde la izquierda. -->
  <aside class="mobile-drawer__panel" role="dialog" aria-label="Menú de navegación">
    <!-- Header — "Navegación" en card glass, idéntico al de moofyvip. -->
    <header class="mobile-drawer__header">
      <span>Navegación</span>
      <button
        type="button"
        class="mobile-drawer__close"
        (click)="closeMenu()"
        aria-label="Cerrar menú"
      >
        <ng-icon name="phosphorX" size="14" />
      </button>
    </header>

    <!-- Lista de items — cada uno un card glass con icono + label. -->
    <nav class="mobile-drawer__list" aria-label="Rutas del sitio">
      @for (link of links; track link.href; let i = $index) {
        <a
          [routerLink]="link.href"
          class="mobile-drawer__item"
          [class.is-active]="isActive(link)"
          [style.--stagger-index]="i"
        >
          <span class="mobile-drawer__item-icon" aria-hidden="true">
            <ng-icon [name]="link.icon" size="18" />
          </span>
          <span class="mobile-drawer__item-label">{{ link.label }}</span>
        </a>
      }
    </nav>
  </aside>
</div>
