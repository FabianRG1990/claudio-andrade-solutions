<!-- Rail — position: absolute. Anclada al top del documento (no al
     viewport): al scrollear baja con la página y desaparece. Pill desktop +
     burger móvil viven aquí — todo el "navbar" (links + acceso a menú) se
     va con el scroll. Decisión consciente: sin nav post-scroll en mobile. -->
<div class="floating-nav-rail">
  <nav
    #navRef
    class="floating-nav__pill"
    aria-label="Navegación principal"
  >
    @for (link of links; track link.href) {
      <a
        [routerLink]="link.href"
        class="floating-nav__link"
        [class.is-active]="isActive(link)"
        (click)="onLinkClick(link.href, $event)"
      >
        <span class="floating-nav__link-indicator" aria-hidden="true"></span>
        <span class="floating-nav__link-text">{{ link.label }}</span>
      </a>
    }
  </nav>

  <button
    type="button"
    class="floating-nav__burger glass-bubble"
    (click)="toggleMenu()"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    [attr.aria-expanded]="menuOpen()"
  >
    @if (menuOpen()) {
      <ng-icon name="phosphorX" size="16" />
    } @else {
      <ng-icon name="phosphorList" size="16" />
    }
  </button>
</div>

<!-- ────────────────────────────────────────────────────────────────────────
     Drawer mobile — réplica del side-menu de moofyvip: panel lateral 280px
     que entra de izquierda a derecha con transición 500ms ease-in-out,
     backdrop con blur que oscurece el contenido detrás. Cada item es un
     card glass con icono protagonista + label + esquina triangular
     decorativa; el item activo gana borde-izquierdo accent + gradiente
     lagoon de fondo.
     ──────────────────────────────────────────────────────────────────── -->
<div
  class="mobile-drawer"
  [class.is-open]="menuOpen()"
  [attr.aria-hidden]="!menuOpen()"
>
  <!-- Backdrop: capa oscura con blur — tap fuera del panel cierra. -->
  <div
    class="mobile-drawer__backdrop"
    (click)="closeMenu()"
    aria-hidden="true"
  ></div>

  <!-- Panel: sidenav que entra desde la izquierda. -->
  <aside class="mobile-drawer__panel" role="dialog" aria-label="Menú de navegación">
    <!-- Header — "Navegación" en card glass, idéntico al de moofyvip. -->
    <header class="mobile-drawer__header">
      <span>Navegación</span>
      <button
        type="button"
        class="mobile-drawer__close"
        (click)="closeMenu()"
        aria-label="Cerrar menú"
      >
        <ng-icon name="phosphorX" size="14" />
      </button>
    </header>

    <!-- Lista de items — cada uno un card glass con icono + label. -->
    <nav class="mobile-drawer__list" aria-label="Rutas del sitio">
      @for (link of links; track link.href; let i = $index) {
        <a
          [routerLink]="link.href"
          class="mobile-drawer__item"
          [class.is-active]="isActive(link)"
          [style.--stagger-index]="i"
        >
          <span class="mobile-drawer__item-icon" aria-hidden="true">
            <ng-icon [name]="link.icon" size="18" />
          </span>
          <span class="mobile-drawer__item-label">{{ link.label }}</span>
        </a>
      }
    </nav>
  </aside>
</div>
