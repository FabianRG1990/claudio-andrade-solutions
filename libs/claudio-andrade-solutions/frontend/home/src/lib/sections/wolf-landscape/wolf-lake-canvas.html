<div #container class="wolf-lake" data-wolf-lake-canvas aria-hidden="true">
  <!-- Imagen base — fallback si WebGL2 no está disponible o reduced-motion. -->
  <img
    #img
    class="wolf-lake__bg"
    src="/hero-wolf/fondo.jpg"
    alt=""
    decoding="async"
    loading="eager"
  />
  <!-- Capa WebGL — reemplaza visualmente al <img> cuando arranca. -->
  <canvas #gl class="wolf-lake__gl"></canvas>
  <!-- Capa Canvas2D — peces que viven sobre la superficie WebGL. -->
  <canvas #fish class="wolf-lake__fish"></canvas>
</div>
