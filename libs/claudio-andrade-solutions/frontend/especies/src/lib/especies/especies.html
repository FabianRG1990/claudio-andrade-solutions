<app-page-header
  eyebrow="Acerca de nosotros · Quiénes somos"
  capitulo="Capítulo 02 / 04 · Equipo + Casos"
  title="Construimos lo que falta,"
  italic="con quienes lo necesitan."
  description="Claudio Andrade Solutions es una consultora tecnológica enfocada en soluciones a medida. Trabajamos con empresas que ya tienen tracción y necesitan tecnología al servicio del negocio — auditorías honestas, sistemas que escalan, e IA integrada al proceso real del negocio."
/>

<!-- Casos / Proyectos en los que hemos trabajado. Esta sección reemplaza
     los "programas activos" del antiguo sitio de acuario; mismo layout
     (grid de 2 columnas, glass-shell-hover) pero contenido portafolio. -->
<section class="especies-programs">
  <div class="especies-programs__container">
    <h3 class="especies-programs__title" appReveal>
      Algunos casos recientes.
      <span class="especies-programs__title-italic">
        El resto, bajo NDA.
      </span>
    </h3>
    <div class="especies-programs__grid">
      @for (p of programs; track p.code; let i = $index) {
        <article
          appReveal
          [delay]="0.05 * i"
          class="program-card glass-shell glass-shell-hover"
          [attr.data-accent]="p.accent"
        >
          <div class="program-card__media">
            <img
              appImgFade
              [src]="p.image"
              [alt]="p.title"
              class="program-card__image"
              decoding="async"
            />
            <div class="program-card__gradient" aria-hidden="true"></div>
            <div class="program-card__code">
              <span class="program-card__code-dot" aria-hidden="true"></span>
              {{ p.code }}
            </div>
          </div>
          <div class="program-card__body">
            <p class="program-card__region">{{ p.region }}</p>
            <h4 class="program-card__title">{{ p.title }}</h4>
            <p class="program-card__copy">{{ p.body }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
