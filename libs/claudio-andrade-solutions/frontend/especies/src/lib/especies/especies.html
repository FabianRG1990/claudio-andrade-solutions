<app-page-header
  eyebrow="Galería · 1.247 especies"
  capitulo="Capítulo 02 / 04 · Galería + Conservación"
  title="Cada habitante,"
  italic="un protocolo propio."
  description="Llevamos un registro vivo de cada criatura: hábitat, dieta, profundidad y estado de conservación. Y abajo, los programas que mantenemos abiertos al mundo para protegerlas."
/>

<!-- Programas activos — único segmento del body. Decisión del usuario:
     se quitaron los 3 segmentos previos (catálogo de especies, bridge
     "Conservación · Misión pública", stats grid de impacto) para que la
     página sea solo Header + Programas. -->
<section class="especies-programs">
  <div class="especies-programs__container">
    <h3 class="especies-programs__title" appReveal>
      Cuatro programas activos.
      <span class="especies-programs__title-italic">
        Una misma corriente.
      </span>
    </h3>
    <div class="especies-programs__grid">
      @for (p of programs; track p.code; let i = $index) {
        <article
          appReveal
          [delay]="0.05 * i"
          class="program-card glass-shell glass-shell-hover"
        >
          <div class="program-card__media">
            <img
              appImgFade
              [src]="p.image"
              [alt]="p.title"
              class="program-card__image"
              decoding="async"
            />
            <div class="program-card__gradient" aria-hidden="true"></div>
            <div class="program-card__code">
              <span class="program-card__code-dot" aria-hidden="true"></span>
              {{ p.code }}
            </div>
          </div>
          <div class="program-card__body">
            <p class="program-card__region">{{ p.region }}</p>
            <h4 class="program-card__title">{{ p.title }}</h4>
            <p class="program-card__copy">{{ p.body }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
