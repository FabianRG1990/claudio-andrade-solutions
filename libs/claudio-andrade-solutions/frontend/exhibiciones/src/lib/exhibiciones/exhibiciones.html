<app-page-header
  eyebrow="Catálogo · 6 productos premium"
  capitulo="Capítulo 01 / 04 · Productos"
  title="Soluciones"
  italic="a medida."
  description="Cada producto es una arquitectura completa, no una plantilla. Stack moderno (Angular · Nx · Firebase · Google Cloud · IA), entregables verificables y un plan claro de mantenimiento. Lo que vendemos es resultado, no horas."
/>

<section class="exhibiciones">
  <div class="exhibiciones__container">
    <div class="exhibiciones__list">
      @for (ex of exhibits; track ex.slug; let i = $index) {
        <article
          appReveal
          class="exhibit-row"
          [class.exhibit-row--reverse]="i % 2 === 1"
        >
          <div class="exhibit-row__media glass-shell">
            <div class="exhibit-row__media-inner">
              <img
                appImgFade
                [src]="ex.image"
                [alt]="ex.name"
                class="exhibit-row__image"
                decoding="async"
              />
              <div class="exhibit-row__media-gradient" aria-hidden="true"></div>
            </div>
          </div>

          <div class="exhibit-row__body">
            <p class="exhibit-row__zone">{{ ex.zone }} · {{ ex.depth }}</p>
            <h2 class="exhibit-row__title">{{ ex.name }}</h2>
            <p class="exhibit-row__copy">{{ ex.description }}</p>
            <dl class="exhibit-row__stats">
              <div class="exhibit-row__stat">
                <dt class="exhibit-row__stat-label">Entregables</dt>
                <dd class="exhibit-row__stat-value">{{ ex.species }}</dd>
              </div>
              <div class="exhibit-row__stat">
                <dt class="exhibit-row__stat-label">Cobertura</dt>
                <dd class="exhibit-row__stat-value">{{ ex.liters }}</dd>
              </div>
              <div class="exhibit-row__stat">
                <dt class="exhibit-row__stat-label">Producto</dt>
                <dd class="exhibit-row__stat-value exhibit-row__stat-value--accent">
                  0{{ i + 1 }}
                </dd>
              </div>
            </dl>
            <div class="exhibit-row__cta-wrap">
              <a routerLink="/contacto" class="exhibit-row__cta glass-button">
                <span class="exhibit-row__cta-label">Pedir propuesta</span>
                <span class="exhibit-row__cta-icon glass-button-icon">
                  <ng-icon name="phosphorArrowUpRightBold" size="12" />
                </span>
              </a>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
